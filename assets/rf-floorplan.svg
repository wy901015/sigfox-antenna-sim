<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <style>
      .title { font: 700 22px sans-serif; fill: #111; }
      .h { font: 600 14px sans-serif; fill: #222; }
      .lbl { font: 12px sans-serif; fill: #333; }
      .note { font: 11px sans-serif; fill: #b45309; }
      .ok { font: 11px sans-serif; fill: #166534; }
      .dim { font: 10px sans-serif; fill: #666; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="#f8fafc"/>
  <text x="40" y="40" class="title">Sigfox scaffold sensor — PCB RF floorplan (from photos)</text>
  <text x="40" y="62" class="dim">Not to scale · for keep-out / HFSS-CST placement · RC4 ~920.8 MHz Tx · board silkscreen ZP_V06</text>

  <rect x="80" y="100" width="520" height="360" rx="18" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="100" y="125" class="h">Enclosure (plastic) — top view</text>

  <path d="M120,150 L540,150 L540,420 L380,420 L380,380 L120,380 Z" fill="#166534" fill-opacity="0.25" stroke="#14532d" stroke-width="2"/>
  <text x="130" y="175" class="lbl">PCB (green)</text>

  <rect x="130" y="160" width="130" height="90" fill="#fecaca" fill-opacity="0.7" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="140" y="180" class="note">ANTENNA ZONE</text>
  <text x="140" y="196" class="note">keep metal OUT</text>

  <ellipse cx="175" cy="205" rx="28" ry="12" fill="none" stroke="#111" stroke-width="2"/>
  <ellipse cx="175" cy="212" rx="28" ry="12" fill="none" stroke="#111" stroke-width="2"/>
  <ellipse cx="175" cy="219" rx="28" ry="12" fill="none" stroke="#111" stroke-width="2"/>
  <text x="210" y="215" class="lbl">Helical ANT</text>

  <path d="M90,190 Q200,200 280,185 Q400,170 560,200" fill="none" stroke="#64748b" stroke-width="4"/>
  <path d="M90,200 Q220,215 300,205 Q420,190 560,220" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="300" y="168" class="note">steel pull-wire / Hall cable</text>
  <line x1="200" y1="175" x2="175" y2="205" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="220" width="100" height="55" rx="4" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
  <text x="308" y="245" class="lbl">WSSFM10R4</text>
  <text x="308" y="262" class="lbl">RC4 AT</text>

  <line x1="300" y1="247" x2="210" y2="215" stroke="#f59e0b" stroke-width="2"/>
  <text x="230" y="240" class="dim">50 ohm RF</text>

  <rect x="250" y="230" width="40" height="20" fill="#fef3c7" stroke="#d97706"/>
  <text x="252" y="244" class="dim">match</text>

  <rect x="400" y="300" width="70" height="70" fill="#1e293b" stroke="#0f172a"/>
  <text x="415" y="340" style="font:12px sans-serif;fill:#fff">MCU</text>

  <rect x="160" y="300" width="50" height="40" fill="#cbd5e1" stroke="#475569"/>
  <text x="168" y="324" class="lbl">2R2</text>
  <text x="160" y="355" class="dim">DC-DC</text>

  <rect x="130" y="340" width="28" height="30" fill="#fff" stroke="#64748b"/>
  <text x="100" y="400" class="lbl">B+/B-</text>

  <rect x="280" y="160" width="40" height="22" fill="#fff" stroke="#64748b"/>
  <text x="286" y="175" class="dim">NTC</text>

  <rect x="450" y="380" width="80" height="18" fill="#f1f5f9" stroke="#64748b"/>
  <text x="455" y="393" class="dim">SWD / UART</text>

  <rect x="620" y="180" width="90" height="160" rx="8" fill="#3b82f6" fill-opacity="0.4" stroke="#1d4ed8"/>
  <text x="635" y="260" class="lbl">LiPo</text>
  <text x="628" y="278" class="dim">3.7V</text>
  <text x="628" y="292" class="dim">3000mAh</text>

  <rect x="80" y="500" width="1040" height="360" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="100" y="530" class="h">Critical issues for unstable Sigfox (ranked)</text>
  <text x="100" y="560" class="note">1. Metal pull-wire in antenna near-field — primary suspect (detune + pattern nulls)</text>
  <text x="100" y="580" class="note">2. Antenna not matched/verified in final enclosure + with cable reeled</text>
  <text x="100" y="600" class="note">3. Helical over copper/traces — GND clearance under antenna likely violated</text>
  <text x="100" y="620" class="note">4. DC-DC (2R2) / digital noise near RF path — spur / desense on TX/RX</text>
  <text x="100" y="640" class="note">5. Antenna type may deviate from module cert (dipole/SMA vs helical/wire)</text>
  <text x="100" y="670" class="ok">Recommended keep-out for ~920 MHz helical (start point for sim)</text>
  <text x="100" y="690" class="lbl">• No metal within ≥25–30 mm of helical (pull-wire, battery tabs, screws, shields)</text>
  <text x="100" y="710" class="lbl">• Clear copper on ALL layers under/around antenna keep-out (follow vendor helical guide)</text>
  <text x="100" y="730" class="lbl">• 50 ohm microstrip/coax from module ANT pad to matching network to antenna</text>
  <text x="100" y="750" class="lbl">• Battery and pull-wire route on opposite side of enclosure from ANT</text>
  <text x="100" y="770" class="lbl">• Measure S11 in fully assembled set (plastic closed, wire at min/mid/max extension)</text>
  <text x="100" y="800" class="dim">RC4 Tx ~920.8 MHz · quarter-wave ~81 mm · module WSSFM10R4AT</text>
  <text x="100" y="825" class="dim">Sim targets: S11 &lt; -10 dB at 920.8 MHz · efficiency · far-field gain with steel cable in/out of keep-out</text>
</svg>
